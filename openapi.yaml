openapi: "3.0.3"
info:
  title: "ledger-service"
  version: "1.1.0"
servers:
  - url: "http://localhost:8111"
paths:
  "/ledgers":
    get:
      summary: "List ledgers"
      responses:
        "200":
          description: OK
    post:
      summary: "Create ledger"
      responses:
        "200":
          description: OK
  "/ledgers/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: "Get ledger by ID"
      responses:
        "200":
          description: OK
  "/ledgers/{id}/history":
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: "History of ledger"
